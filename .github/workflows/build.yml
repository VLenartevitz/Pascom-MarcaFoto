name: Build Watermark Studio (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  WAILS_VERSION: 'v2.8.1'

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo $(go env GOPATH)/bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            $(go env GOMODCACHE)
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Verify frontend build output
        run: |
          if (-not (Test-Path 'dist')) {
            Write-Error 'Frontend build failed: dist/ not found'
            exit 1
          }
          Write-Host 'Frontend build OK: $(Get-ChildItem dist | Measure-Object).Count files'

      - name: Download Go modules
        run: go mod download

      - name: Build Wails (Windows amd64)
        run: |
          wails build -platform windows/amd64 -clean -ldflags "-s -w -H=windowsgui"

      - name: Verify executable
        run: |
          $exePath = 'build/bin/watermark-studio.exe'
          if (-not (Test-Path $exePath)) {
            Write-Error 'Build failed: $exePath not found'
            exit 1
          }
          $size = (Get-Item $exePath).Length / 1MB
          Write-Host 'Executable OK: $exePath ($([math]::Round($size, 2)) MB)'

      - name: Generate version info
        id: version
        run: |
          $version = 'dev'
          if ($env:GITHUB_REF_NAME -match '^v(.+)$') {
            $version = $matches[1]
          } elseif ($env:GITHUB_REF_NAME -eq 'main' -or $env:GITHUB_REF_NAME -eq 'master') {
            $version = 'latest'
          } else {
            $version = $env:GITHUB_REF_NAME -replace '[^a-zA-Z0-9.-]', '-'
          }
          $date = Get-Date -Format 'yyyyMMdd-HHmmss'
          $fullVersion = "$version-$date"
          echo "VERSION=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare artifacts
        run: |
          $version = ${{ steps.version.outputs.VERSION }}
          $src = 'build/bin/watermark-studio.exe'
          $destDir = 'artifacts'
          New-Item -ItemType Directory -Path $destDir -Force | Out-Null
          Copy-Item $src "$destDir/watermark-studio-$version.exe" -Force
          Copy-Item $src "$destDir/Watermark Studio-$version.exe" -Force
          Copy-Item $src "$destDir/watermark-studio.exe" -Force
          Copy-Item $src "$destDir/Watermark Studio.exe" -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: watermark-studio-windows-${{ steps.version.outputs.VERSION }}
          path: artifacts/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-core:
    name: Test Core (Linux Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Go tests in Docker
        run: |
          docker run --rm -v '${{ github.workspace }}:/app' -w /app golang:1.22-bookworm go test ./...

      - name: Build CLI (cross-compile)
        run: |
          docker run --rm -v '${{ github.workspace }}:/app' -w /app \\
            -e CGO_ENABLED=0 -e GOOS=windows -e GOARCH=amd64 \\
            golang:1.22-bookworm go build -trimpath -o watermark.exe ./cmd/watermark

      - name: Upload CLI executable
        uses: actions/upload-artifact@v4
        with:
          name: watermark-cli-windows
          path: watermark.exe
          retention-days: 30
